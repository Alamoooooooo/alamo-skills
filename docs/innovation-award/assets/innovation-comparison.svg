<rect width="1600" height="900" fill="#fff"/><text x="800" y="42" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#172b4d">图 14 传统资源优化方式与 Skill + Agent 方法对比</text><text x="800" y="72" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#667085">从单项目人工经验转向可迁移、可治理、可审计的工程能力</text>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16"><rect x="110" y="120" width="600" height="650" rx="10" fill="#fff8f7" stroke="#d92d20" stroke-width="2"/><rect x="890" y="120" width="600" height="650" rx="10" fill="#f5fbf8" stroke="#4e947d" stroke-width="2"/><text x="410" y="165" text-anchor="middle" font-size="23" font-weight="700" fill="#b42318">传统方式</text><text x="1190" y="165" text-anchor="middle" font-size="23" font-weight="700" fill="#24634f">Skill + Agent 方式</text><g text-anchor="middle"><rect x="160" y="205" width="500" height="70" rx="7" fill="#fff" stroke="#f0a4a0"/><text x="410" y="247">个人经验 · 临时脚本</text><rect x="940" y="205" width="500" height="70" rx="7" fill="#fff" stroke="#9ed0bd"/><text x="1190" y="247">Memory Skill · 模式库与协议</text><rect x="160" y="315" width="500" height="70" rx="7" fill="#fff" stroke="#f0a4a0"/><text x="410" y="357">人工定位 · 一次性修改</text><rect x="940" y="315" width="500" height="70" rx="7" fill="#fff" stroke="#9ed0bd"/><text x="1190" y="357">RunIntent / RunPlan · 有界编排</text><rect x="160" y="425" width="500" height="70" rx="7" fill="#fff" stroke="#f0a4a0"/><text x="410" y="467">范围依赖人工把控</text><rect x="940" y="425" width="500" height="70" rx="7" fill="#fff" stroke="#9ed0bd"/><text x="1190" y="467">文件、命令、预算、轮次前置约束</text><rect x="160" y="535" width="500" height="70" rx="7" fill="#fff" stroke="#f0a4a0"/><text x="410" y="577">关注任务是否跑通</text><rect x="940" y="535" width="500" height="70" rx="7" fill="#fff" stroke="#9ed0bd"/><text x="1190" y="577">输出、验证、测量、复核多重 Gate</text><rect x="160" y="645" width="500" height="70" rx="7" fill="#fff" stroke="#f0a4a0"/><text x="410" y="687">单项目有效 · 难以迁移</text><rect x="940" y="645" width="500" height="70" rx="7" fill="#fff" stroke="#9ed0bd"/><text x="1190" y="687">项目 Overlay · 跨系统复用</text></g><path d="M745 180v570" stroke="#526174" stroke-width="3" stroke-dasharray="8 8"/><text x="800" y="440" text-anchor="middle" font-size="19" font-weight="700" fill="#344054" transform="rotate(-90 8