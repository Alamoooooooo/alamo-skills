<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900">
<rect width="1800" height="900" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="900" y="42" text-anchor="middle" font-size="30" font-weight="700" fill="#172b4d">图 13 资源预算收敛与峰值控制机制</text><text x="900" y="72" text-anchor="middle" font-size="16" fill="#667085">峰值来源识别 → 控制策略选择 → 可控运行区间 → 证据 Gate 接受判定</text>
<rect x="70" y="120" width="420" height="620" rx="10" fill="#fff8f7" stroke="#d92d20" stroke-width="2"/><text x="105" y="162" font-size="22" font-weight="700" fill="#b42318">A  超载风险状态</text><text x="105" y="197" font-size="16" fill="#667085">脱敏峰值需求区间：60 至 70 GB</text><g text-anchor="middle"><rect x="125" y="240" width="120" height="290" fill="#d92d20"/><rect x="265" y="310" width="90" height="220" fill="#f79009"/><rect x="375" y="350" width="55" height="180" fill="#a56e91"/><text x="185" y="565" font-size="15">中间对象</text><text x="310" y="565" font-size="15">输入数据</text><text x="402" y="565" font-size="15">并发/模型</text><path d="M105 600h330" stroke="#98a2b3"/><text x="270" y="635" font-size="18" font-weight="700" fill="#b42318">需求超过 50 GB 上限</text><text x="270" y="670" font-size="16" fill="#667085">Merge / Join / 切片的峰值叠加</text></g>
<rect x="555" y="120" width="690" height="620" rx="10" fill="#f8fafc" stroke="#98a2b3" stroke-width="2"/><text x="590" y="162" font-size="22" font-weight="700" fill="#344054">B  峰值来源与控制策略矩阵</text><g font-size="16" text-anchor="middle"><text x="760" y="215" font-weight="700">输入数据</text><text x="930" y="215" font-weight="700">中间对象</text><text x="1100" y="215" font-weight="700">评分与并发</text><text x="620" y="275" font-weight="700">读取阶段</text><text x="620" y="375" font-weight="700">连接阶段</text><text x="620" y="475" font-weight="700">评分阶段</text><text x="620" y="575" font-weight="700">接近上限时</text></g><g stroke="#d0d5dd"><path d="M690 235h490M690 335h490M690 435h490M690 535h490M690 635h490M690 235v400M855 235v400M1020 235v400M1180 235v400"/></g><g text-anchor="middle" font-size="15"><rect x="705" y="250" width="135" height="65" rx="6" fill="#eaf2fb" stroke="#527da8"/><text x="772" y="280">列裁剪</text><text x="772" y="302">row-group</text><rect x="870" y="350" width="135" height="65" rx="6" fill="#fff8e8" stroke="#c49a36"/><text x="937" y="380">候选上限</text><text x="937" y="402">分批 Join</text><rect x="1035" y="450" width="130" height="65" rx="6" fill="#f7eef5" stroke="#a56e91"/><text x="1100" y="480">分批评分</text><text x="1100" y="502">及时释放</text><rect x="870" y="550" width="135" height="65" rx="6" fill="#edf8f3" stroke="#4e947d"/><text x="937" y="580">预算 Gate</text><text x="937" y="602">降级/停止</text></g>
<rect x="1310" y="120" width="420" height="620" rx="10" fill="#f5fbf8" stroke="#4e947d" stroke-width="2"/><text x="1345" y="162" font-size="22" font-weight="700" fill="#24634f">C  可控运行区间</text><text x="1345" y="197" font-size="16" fill="#667085">同一 50 GB 资源上限下的主要占用区间</text><path d="M1390 590V255M1390 590h250" stroke="#667085" stroke-width="2"/><path d="M1410 455h195" stroke="#4e947d" stroke-width="70" opacity=".82"/><path d="M1410 425h195" stroke="#4e947d" stroke-width="2" stroke-dasharray="8 6"/><path d="M1410 485h195" stroke="#4e947d" stroke-width="2" stroke-dasharray="8 6"/><text x="1510" y="390" text-anchor="middle" font-size="23" font-weight="700" fill="#24634f">20 至 30 GB</text><text x="1510" y="530" text-anchor="middle" font-size="16" fill="#24634f">主要运行占用区间</text><path d="M1410 255h195" stroke="#d92d20" stroke-width="3" stroke-dasharray="10 7"/><text x="1510" y="242" text-anchor="middle" font-size="15" fill="#b42318">50 GB 资源上限</text><text x="1510" y="650" text-anchor="middle" font-size="18" font-weight="700" fill="#24634f">余量：约 20 至 30 GB</text>
<path d="M490 430h55" stroke="#526174" stroke-width="4" marker-end="url(#a)"/><path d="M1245 430h55" stroke="#526174" stroke-width="4" marker-end="url(#a)"/><rect x="260" y="790" width="1280" height="62" rx="8" fill="#eef0f4" stroke="#98a2b3"/><text x="900" y="830" text-anchor="middle" font-size="17" fill="#344054">说明：图示为机制与区间的综合表达，资源改善结论以统一测量口径、输出契约和 Review Gate 的共同满足为准</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#526174"/></marker></defs></svg>
