<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="820" viewBox="0 0 1700 820">
<rect width="1700" height="820" fill="#fff"/><text x="850" y="42" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#172b4d">图 16 Memory Skill 面向多类国产化任务的迁移方式</text><text x="850" y="72" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#667085">保持通用 Core 不变，通过项目 Overlay 适配不同数据链路与验证口径</text>
