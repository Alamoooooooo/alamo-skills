<path d="M860 180h80M860 335h80M860 490h80M860 645h80" stroke="#526174" stroke-width="3" marker-end="url(#a)"/><g font-size="16"><rect x="970" y="120" width="580" height="120" rx="8" fill="#fff8e8" stroke="#c49a36"/><text x="1260" y="165" font-size="19" font-weight="700">项目 Overlay</text><text x="1260" y="200">热点路径 · 字段契约 · smoke 命令 · 测量口径</text><rect x="970" y="275" width="580" height="120" rx="8" fill="#fff8e8" stroke="#c49a36"/><text x="1260" y="320" font-size="19" font-weight="700">项目 Overlay</text><text x="1260" y="355">扫描边界 · 聚合约束 · 输出不变量</text><rect x="970" y="430" width="580" height="120" rx="8" fill="#fff8e8" stroke="#c49a36"/><text x="1260" y="475" font-size="19" font-weight="700">项目 Overlay</text><text x="1260" y="510">批大小 · 模型输入 · 推理测量</text><rect x="970" y="585" width="580" height="120" rx="8" fill="#fff8e8" stroke="#c49a36"/><text x="1260" y="630" font-size="19" font-weight="700">项目 Overlay</text><text x="1260" y="665">评估窗口 · 结果一致性 · 发布门禁</text></g><text x="850" y="780" font-size="17" fill="#475467">迁移原则：复用通用知识，隔离项目差异，统一证据输出</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#526174"/></marker></defs></svg>
