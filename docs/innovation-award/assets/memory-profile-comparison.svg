<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <rect width="1280" height="760" fill="#f7f9fc"/>
  <text x="640" y="38" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="700" fill="#14213d">运行过程内存热点剖面对比（脱敏示意）</text>
  <text x="640" y="68" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" fill="#65748b">展示读取、Merge、筛选、特征构建、评分和评估阶段的内存占用变化；正式提交前替换为同一批次真实监控数据</text>
  <g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">
    <rect x="100" y="105" width="1080" height="480" fill="white" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="160" y1="145" x2="160" y2="535" stroke="#526174" stroke-width="3"/><line x1="160" y1="535" x2="1135" y2="535" stroke="#526174" stroke-width="3"/>
    <g font-size="15" fill="#526174" text-anchor="end"><text x="150" y="540">0</text><text x="150" y="462">10 GB</text><text x="150" y="384">20 GB</text><text x="150" y="306">30 GB</text><text x="150" y="228">40 GB</text><text x="150" y="150">50 GB</text></g>
    <g stroke="#dce3eb" stroke-width="1"><line x1="160" y1="457" x2="1135" y2="457"/><line x1="160" y1="379" x2="1135" y2="379"/><line x1="160" y1="301" x2="1135" y2="301"/><line x1="160" y1="223" x2="1135" y2="223"/><line x1="160" y1="145" x2="1135" y2="145"/></g>
    <line x1="160" y1="145" x2="1135" y2="145" stroke="#9c2c2c" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="1125" y="137" text-anchor="end" font-size="15" fill="#9c2c2c">50 GB 资源上限</text>
    <g fill="#eef2f7" stroke="#d1dae6"><rect x="160" y="145" width="135" height="390"/><rect x="295" y="145" width="135" height="390"/><rect x="430" y="145" width="135" height="390"/><rect x="565" y="145" width="135" height="390"/><rect x="700" y="145" width="135" height="390"/><rect x="835" y="145" width="135" height="390"/><rect x="970" y="145" width="165" height="390"/></g>
    <g font-size="16" fill="#344054" text-anchor="middle"><text x="227" y="565">读取数据</text><text x="362" y="565">Merge</text><text x="497" y="565">筛选</text><text x="632" y="565">特征构建</text><text x="767" y="565">模型评分</text><text x="902" y="565">评估</text><text x="1052" y="565">输出与清理</text></g>
    <polyline points="160,480 205,455 250,420 295,350 340,315 385,260 430,185 475,155 520,120 565,125 610,105 655,135 700,155 745,180 790,205 835,225 880,245 925,260 970,270 1015,255 1060,240 1135,245" fill="none" stroke="#d95d5d" stroke-width="6"/>
    <polyline points="160,480 205,465 250,450 295,440 340,425 385,415 430,405 475,390 520,375 565,365 610,350 655,340 700,335 745,328 790,323 835,320 880,315 925,310 970,305 1015,300 1060,297 1135,295" fill="none" stroke="#299b88" stroke-width="6"/>
    <g fill="#d95d5d"><circle cx="160" cy="480" r="5"/><circle cx="295" cy="350" r="5"/><circle cx="430" cy="185" r="7"/><circle cx="565" cy="125" r="5"/><circle cx="610" cy="105" r="8"/><circle cx="700" cy="155" r="5"/><circle cx="835" cy="225" r="5"/><circle cx="970" cy="270" r="5"/><circle cx="1135" cy="245" r="5"/></g>
    <g fill="#299b88"><circle cx="160" cy="480" r="5"/><circle cx="295" cy="440" r="5"/><circle cx="430" cy="405" r="5"/><circle cx="565" cy="365" r="5"/><circle cx="700" cy="335" r="5"/><circle cx="835" cy="320" r="7"/><circle cx="970" cy="305" r="5"/><circle cx="1135" cy="295" r="5"/></g>
    <line x1="610" y1="105" x2="610" y2="78" stroke="#9c2c2c" stroke-width="2"/><text x="620" y="74" font-size="15" font-weight="700" fill="#9c2c2c">优化前峰值约 55 GB：特征构建</text>
    <line x1="430" y1="185" x2="430" y2="160" stroke="#9c2c2c" stroke-width="2"/><text x="440" y="156" font-size="15" font-weight="700" fill="#9c2c2c">Merge 次峰值约 45 GB</text>
    <line x1="835" y1="320" x2="835" y2="350" stroke="#176d60" stroke-width="2"/><text x="845" y="370" font-size="15" font-weight="700" fill="#176d60">优化后峰值约 28 GB：模型评分</text>
    <rect x="830" y="115" width="285" height="62" rx="8" fill="white" stroke="#cbd5e1"/><line x1="850" y1="137" x2="900" y2="137" stroke="#d95d5d" stroke-width="6"/><text x="912" y="143" font-size="16" fill="#344054">优化前：峰值超过 50 GB</text><line x1="850" y1="160" x2="900" y2="160" stroke="#299b88" stroke-width="6"/><text x="912" y="166" font-size="16" fill="#344054">优化后：主要处于 20 至 30 GB</text>
    <rect x="190" y="175" width="245" height="72" rx="8" fill="#fff0f0" stroke="#d95d5d"/><text x="312" y="203" text-anchor="middle" font-size="16" font-weight="700" fill="#9c2c2c">热点 1：Merge</text><text x="312" y="229" text-anchor="middle" font-size="14" fill="#4a2020">宽表与候选对象同时驻留</text>
    <rect x="445" y="90" width="265" height="72" rx="8" fill="#fff0f0" stroke="#d95d5d"/><text x="577" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#9c2c2c">热点 2：特征构建</text><text x="577" y="144" text-anchor="middle" font-size="14" fill="#4a2020">全量物化后再筛选</text>
    <rect x="760" y="590" width="355" height="58" rx="8" fill="#eaf8f5" stroke="#299b88"/><text x="937" y="615" text-anchor="middle" font-size="15" fill="#176d60">优化措施：分块读取、列裁剪、流式评分</text><text x="937" y="637" text-anchor="middle" font-size="15" fill="#176d60">阶段性落盘、memory guard</text>
  </g>
</svg>
