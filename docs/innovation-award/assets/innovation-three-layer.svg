<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
<rect width="1600" height="820" fill="#fff"/><text x="800" y="42" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#172b4d">图 2 项目创新机制三层模型</text><text x="800" y="72" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#667085">从专家经验沉淀到资源改善结论的工程化转换</text>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="90" y="120" width="1420" height="170" rx="10" fill="#edf4fb" stroke="#527da8" stroke-width="2"/><text x="125" y="158" font-size="22" font-weight="700" fill="#214b73">知识创新层：经验可迁移</text><text x="125" y="202" font-size="19" fill="#344054">个人排查经验</text><path d="M300 195h120" stroke="#526174" stroke-width="3" marker-end="url(#a)"/><rect x="440" y="172" width="300" height="55" rx="7" fill="#fff" stroke="#8da9c7"/><text x="590" y="207" text-anchor="middle" font-size="18" font-weight="700">Memory Skill 知识包</text><path d="M760 195h120" stroke="#526174" stroke-width="3" marker-end="url(#a)"/><text x="920" y="202" font-size="19" fill="#344054">模式库 · 协议 · Overlay · 复用资产</text>
<rect x="90" y="325" width="1420" height="170" rx="10" fill="#edf8f3" stroke="#4e947d" stroke-width="2"/><text x="125" y="363" font-size="22" font-weight="700" fill="#24634f">工程机制层：过程可治理</text><text x="125" y="407" font-size="19" fill="#344054">人工定位与一次性修改</text><path d="M365 400h105" stroke="#526174" stroke-width="3" marker-end="url(#a)"/><rect x="490" y="377" width="330" height="55" rx="7" fill="#fff" stroke="#74ad99"/><text x="655" y="412" text-anchor="middle" font-size="18" font-weight="700">Skill + Agent 有界闭环</text><path d="M840 400h105" stroke="#526174" stroke-width="3" marker-end="url(#a)"/><text x="980" y="407" font-size="19" fill="#344054">RunIntent · RunPlan · 策略边界 · 安全停止</text>
<rect x="90" y="530" width="1420" height="170" rx="10" fill="#fff8e8" stroke="#c49a36" stroke-width="2"/><text x="125" y="568" font-size="22" font-weight="700" fill="#765c14">治理证据层：结论可审计</text><text x="125" y="612" font-size="19" fill="#344054">任务跑通或模型自述</text><path d="M350 605h120" stroke="#526174" stroke-width="3" marker-end="url(#a)"/><rect x="490" y="582" width="330" height="55" rx="7" fill="#fff" stroke="#d2ad51"/><text x="655" y="617" text-anchor="middle" font-size="18" font-weight="700">多重 Gate 证据链</text><path d="M840 605h105" stroke="#526174" stroke-width="3" marker-end="url(#a)"/><text x="980" y="612" font-size="19" fill="#344054">范围 · 输出 · 验证 · 测量 · 复核 → 接受结论</text>
<path d="M1320 215v360" stroke="#7f56d9" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#b)"/><text x="1360" y="390" font-size="17" fill="#6941c6">逐层约束</text><text x="800" y="770" text-anchor="middle" font-size="17" fill="#475467">创新主线：知识资产化 → 优化流程化 → 资源结果证据化</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#526174"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#7f56d9"/></marker></defs></svg>
