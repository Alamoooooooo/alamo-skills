<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
<rect width="1500" height="920" fill="#fff"/>
<text x="750" y="42" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#172b4d">图 4 Agent 执行机制、控制边界与证据产物</text>
<text x="750" y="72" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#667085">从用户目标到可接受优化结论的受治理状态推进</text>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<rect x="65" y="105" width="1370" height="125" rx="10" fill="#eef4fb" stroke="#527da8" stroke-width="2"/><text x="95" y="140" font-size="21" font-weight="700" fill="#214b73">输入与意图建模</text>
<rect x="95" y="160" width="285" height="48" rx="6" fill="#fff" stroke="#8da9c7"/><text x="237" y="190" text-anchor="middle" font-size="16">用户目标 / 资源问题</text>
<rect x="425" y="160" width="285" height="48" rx="6" fill="#fff" stroke="#8da9c7"/><text x="567" y="190" text-anchor="middle" font-size="16">RunIntent：目标与不变量</text>
<rect x="755" y="160" width="285" height="48" rx="6" fill="#fff" stroke="#8da9c7"/><text x="897" y="190" text-anchor="middle" font-size="16">RunPlan：步骤与预算</text>
<rect x="1085" y="160" width="315" height="48" rx="6" fill="#fff" stroke="#8da9c7"/><text x="1242" y="190" text-anchor="middle" font-size="16">权限、范围、停止条件</text>
<rect x="65" y="270" width="1370" height="250" rx="10" fill="#edf8f3" stroke="#4e947d" stroke-width="2"/><text x="95" y="305" font-size="21" font-weight="700" fill="#24634f">受控执行状态机</text>
<g font-size="17" font-weight="700" text-anchor="middle"><rect x="95" y="345" width="190" height="85" rx="7" fill="#fff" stroke="#74ad99"/><text x="190" y="380">S1 目标完整性</text><text x="190" y="407" font-size="14" font-weight="400">目标文件 / 版本</text><rect x="335" y="345" width="190" height="85" rx="7" fill="#fff" stroke="#74ad99"/><text x="430" y="380">S2 memory-check</text><text x="430" y="407" font-size="14" font-weight="400">热点与风险分级</text><rect x="575" y="345" width="190" height="85" rx="7" fill="#fff" stroke="#74ad99"/><text x="670" y="380">S3 memory-fix</text><text x="670" y="407" font-size="14" font-weight="400">候选修复与影响</text><rect x="815" y="345" width="190" height="85" rx="7" fill="#fff" stroke="#74ad99"/><text x="910" y="380">S4 validation</text><text x="910" y="407" font-size="14" font-weight="400">输出契约与测试</text><rect x="1055" y="345" width="190" height="85" rx="7" fill="#fff" stroke="#74ad99"/><text x="1150" y="380">S5 measurement</text><text x="1150" y="407" font-size="14" font-weight="400">峰值、区间与口径</text><rect x="1175" y="455" width="190" height="45" rx="7" fill="#fff" stroke="#74ad99"/><text x="1270" y="483">S6 memory-review</text></g>
<path d="M285 387h50M525 387h50M765 387h50M1005 387h50M1150 430v25" stroke="#526174" stroke-width="3" fill="none" marker-end="url(#a)"/>
<rect x="65" y="560" width="1370" height="155" rx="10" fill="#fff8e8" stroke="#c49a36" stroke-width="2"/><text x="95" y="595" font-size="21" font-weight="700" fill="#765c14">策略约束与安全停止</text>
<rect x="105" y="625" width="245" height="55" rx="6" fill="#fff" stroke="#d2ad51"/><text x="227" y="659" text-anchor="middle" font-size="16">命令 / 文件白名单</text><rect x="395" y="625" width="245" height="55" rx="6" fill="#fff" stroke="#d2ad51"/><text x="517" y="659" text-anchor="middle" font-size="16">资源预算与候选上限</text><rect x="685" y="625" width="245" height="55" rx="6" fill="#fff" stroke="#d2ad51"/><text x="807" y="659" text-anchor="middle" font-size="16">输出契约 / 不变量</text><rect x="975" y="625" width="245" height="55" rx="6" fill="#fff" stroke="#d2ad51"/><text x="1097" y="659" text-anchor="middle" font-size="16">最大轮次 / 收益阈值</text><rect x="1265" y="625" width="120" height="55" rx="6" fill="#fff1f0" stroke="#d92d20"/><text x="1325" y="659" text-anchor="middle" font-size="16" fill="#b42318">STOP</text>
<rect x="65" y="755" width="1370" height="110" rx="10" fill="#f7eef5" stroke="#a56e91" stroke-width="2"/><text x="95" y="790" font-size="21" font-weight="700" fill="#713c5d">结构化证据产物与决策输出</text><text x="105" y="830" font-size="17" fill="#344054">Findings → Fix → Validation → Measurement → Review → Gate 结果 → 接受 / 下一轮 RunPlan / 人工复核</text>
<path d="M750 230v40M750 520v40M750 715v40" stroke="#526174" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M1270 500 C 1420 520, 1415 330, 1260 300" fill="none" stroke="#d92d20" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#b)"/><text x="1250" y="540" text-anchor="middle" font-size="15" fill="#b42318">失败、越界或收益不足时安全停止</text><path d="M1260 885 C 1050 950, 450 950, 240 875" fill="none" stroke="#7f56d9" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#a)"/><text x="750" y="970" text-anchor="middle" font-size="15" fill="#6941c6">Review 结果反馈至下一轮计划，形成有界迭代而非无限循环</text>
</g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#526174"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#d92d20"/></marker></defs></svg>
