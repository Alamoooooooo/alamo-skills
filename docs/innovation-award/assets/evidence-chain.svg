<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="760" viewBox="0 0 1700 760">
<rect width="1700" height="760" fill="#fff"/><text x="850" y="42" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#172b4d">图 15 资源优化结论的证据链与责任边界</text><text x="850" y="72" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#667085">每个结论节点均绑定证据类型、执行主体和可追溯产物</text>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" text-anchor="middle"><rect x="60" y="150" width="190" height="105" rx="8" fill="#edf4fb" stroke="#527da8"/><text x="155" y="190" font-weight="700">代码观察</text><text x="155" y="220">文件 / 路径 / 行为</text><path d="M250 202h35" stroke="#526174" stroke-width="3" marker-end="url(#a)"/><rect x="290" y="150" width="190" height="105" rx="8" fill="#edf4fb" stroke="#527da8"/><text x="385" y="190" font-weight="700">热点发现</text><text x="385" y="220">Finding / 风险等级</text><path d="M480 202h35" stroke="#526174" stroke-width="3" marker-end="url(#a)"/><rect x="520" y="150" width="190" height="105" rx="8" fill="#fff8e8" stroke="#c49a36"/><text x="615" y="190" font-weight="700">候选修复</text><text x="615" y="220">Fix / 变更范围</text><path d="M710 202h35" stroke="#526174" stroke-width="3" marker-end="url(#a)"/><rect x="750" y="150" width="190" height="105" rx="8" fill="#fff8e8" stroke="#c49a36"/><text x="845" y="190" font-weight="700">输出验证</text><text x="845" y="220">契约 / 不变量</text><path d="M940 202h35" stroke="#526174" stroke-width="3" marker-end="url(#a)"/><rect x="980" y="150" width="190" height="105" rx="8" fill="#edf8f3" stroke="#4e947d"/><text x="1075" y="190" font-weight="700">资源测量</text><text x="1075" y="220">峰值 / 区间 / 口径</text><path d="M1170 202h35" stroke="#526174" stroke-width="3" marker-end="url(#a)"/><rect x="1210" y="150" width="190" height="105" rx="8" fill="#edf8f3" stroke="#4e947d"/><text x="1305" y="190" font-weight="700">独立复核</text><text x="1305" y="220">Review / 残余风险</text><path d="M1400 202h35" stroke="#526174" stroke-width="3" marker-end="url(#a)"/><rect x="1440" y="150" width="190" height="105" rx="8" fill="#f7eef5" stroke="#a56e91"/><text x="1535" y="190" font-weight="700">接受结论</text><text x="1535" y="220">Gate 全部通过</text>
<path d="M385 300v90M615 300v90M1075 300v90M1305 300v90" stroke="#7f56d9" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#b)"/><g text-anchor="start" font-size="16"><text x="270" y="350" fill="#6941c6">Skill：提供规则与模式</text><text x="505" y="350" fill="#6941c6">Agent：编排候选与验证</text><text x="960" y="350" fill="#6941c6">运行环境：提供测量记录</text><text x="1190" y="350" fill="#6941c6">工程人员：审核与发布</text></g><rect x="230" y="460" width="1240" height="120" rx="9" fill="#f8fafc" stroke="#98a2b3"/><text x="850" y="505" text-anchor="middle" font-size="20" font-weight="700">证据门禁原则</text><text x="850" y="545" text-anchor="middle">没有范围、输出、验证、测量和复核的完整记录，只能称为候选优化或初步验证</text><text x="850" y="670" text-anchor="middle" font-size="17" fill="#475467">责任分离而证据贯通：Agent 提效，人员决策，运行数据负责证明</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#526174"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#7f56d9"/></marker></defs></svg>
