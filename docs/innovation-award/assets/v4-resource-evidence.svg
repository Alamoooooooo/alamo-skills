<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#fff"/><text x="600" y="42" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="700" fill="#1f2937">图 6 资源约束下的峰值控制效果</text><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><line x1="150" y1="500" x2="1080" y2="500" stroke="#475467" stroke-width="3"/><line x1="150" y1="110" x2="150" y2="500" stroke="#475467" stroke-width="3"/><g stroke="#dbe3ec"><line x1="150" y1="422" x2="1080" y2="422"/><line x1="150" y1="344" x2="1080" y2="344"/><line x1="150" y1="266" x2="1080" y2="266"/><line x1="150" y1="188" x2="1080" y2="188"/><line x1="150" y1="110" x2="1080" y2="110"/></g><g fill="#475467" font-size="15" text-anchor="end"><text x="140" y="505">0</text><text x="140" y="427">10 GB</text><text x="140" y="349">20 GB</text><text x="140" y="271">30 GB</text><text x="140" y="193">40 GB</text><text x="140" y="115">50 GB</text></g><line x1="150" y1="110" x2="1080" y2="110" stroke="#b42318" stroke-width="2" stroke-dasharray="9 7"/><text x="1075" y="101" text-anchor="end" font-size="15" fill="#b42318">可用内存上限</text><rect x="280" y="75" width="220" height="425" fill="#f4b4ad" stroke="#b42318" stroke-width="2"/><rect x="700" y="266" width="220" height="234" fill="#9ed8c8" stroke="#16806b" stroke-width="2"/><text x="390" y="60" text-anchor="middle" font-size="18" font-weight="700" fill="#b42318">优化前：需求约 55 GB</text><text x="810" y="250" text-anchor="middle" font-size="18" font-weight="700" fill="#16806b">优化后：主要处于 20 至 30 GB</text><text x="390" y="535" text-anchor="middle" font-size="20" font-weight="700" fill="#344054">超载风险</text><text x="810" y="535" text-anchor="middle" font-size="20" font-weight="700" fill="#344054">可运行区间</text><text x="600" y="590" text-anchor="middle" font-size="17" fill="#667085">同一资源上限下，软件优化降低峰值并恢复运行余量；正式申报应附原始监控证据</text></g></svg>
