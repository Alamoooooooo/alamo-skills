<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080">
<rect width="1800" height="1080" fill="#fff"/><text x="900" y="40" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#172b4d">图 1 Skill + Agent 分层架构、内部模块与端到端信息流</text><text x="900" y="70" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#667085">模块级拆解：知识供给 → 意图建模 → 受控编排 → 业务处理 → 证据反馈</text>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="50" y="100" width="1700" height="220" rx="10" fill="#edf4fb" stroke="#527da8" stroke-width="2"/><text x="80" y="135" font-size="21" font-weight="700" fill="#214b73">I  Skill 知识供给层（可迁移知识包）</text><g font-size="15" text-anchor="middle"><rect x="85" y="165" width="220" height="110" fill="#fff" stroke="#8da9c7"/><text x="195" y="195" font-weight="700">协议与证据层</text><text x="195" y="220">Findings / Fix / Review</text><text x="195" y="245">Output Contract / Gate</text><rect x="335" y="165" width="220" height="110" fill="#fff" stroke="#8da9c7"/><text x="445" y="195" font-weight="700">Skill Core</text><text x="445" y="220">memory-check</text><text x="445" y="245">memory-fix / review</text><rect x="585" y="165" width="260" height="110" fill="#fff" stroke="#8da9c7"/><text x="715" y="195" font-weight="700">技术栈模式库</text><text x="715" y="220">Pandas / DuckDB / Parquet</text><text x="715" y="245">NumPy / Polars / GC / 推理</text><rect x="875" y="165" width="260" height="110" fill="#fff" stroke="#8da9c7"/><text x="1005" y="195" font-weight="700">项目 Overlay</text><text x="1005" y="220">热点路径 / 业务契约</text><text x="1005" y="245">验证命令 / 测量口径</text><rect x="1165" y="165" width="250" height="110" fill="#fff" stroke="#8da9c7"/><text x="1290" y="195" font-weight="700">宿主适配层</text><text x="1290" y="220">Codex / Prompt Bundle</text><text x="1290" y="245">degraded mode / portability</text><rect x="1446" y="165" width="250" height="110" fill="#fff" stroke="#8da9c7"/><text x="1571" y="195" font-weight="700">知识版本与依赖</text><text x="1571" y="220">Recipe / RulePack</text><text x="1571" y="245">dependency diagnostics</text></g>
<rect x="50" y="360" width="1700" height="220" rx="10" fill="#edf8f3" stroke="#4e947d" stroke-width="2"/><text x="80" y="395" font-size="21" font-weight="700" fill="#24634f">II  Agent 受治理编排层（状态与策略）</text><g font-size="15" text-anchor="middle"><rect x="85" y="425" width="220" height="110" fill="#fff" stroke="#74ad99"/><text x="195" y="455" font-weight="700">目标解析器</text><text x="195" y="480">业务目标 / 资源痛点</text><text x="195" y="505">RunIntent</text><rect x="335" y="425" width="220" height="110" fill="#fff" stroke="#74ad99"/><text x="445" y="455" font-weight="700">计划编译器</text><text x="445" y="480">RunPlan / 步骤依赖</text><text x="445" y="505">预算 / 停止条件</text><rect x="585" y="425" width="220" height="110" fill="#fff" stroke="#74ad99"/><text x="695" y="455" font-weight="700">策略执行器</text><text x="695" y="480">路径 / 权限 / 命令白名单</text><text x="695" y="505">目标完整性校验</text><rect x="835" y="425" width="220" height="110" fill="#fff" stroke="#74ad99"/><text x="945" y="455" font-weight="700">Skill 编排器</text><text x="945" y="480">调用顺序 / 状态转换</text><text x="945" y="505">候选变更编排</text><rect x="1085" y="425" width="220" height="110" fill="#fff" stroke="#74ad99"/><text x="1195" y="455" font-weight="700">验证测量器</text><text x="1195" y="480">输出契约 / 资源曲线</text><text x="1195" y="505">峰值 / 区间 / 口径</text><rect x="1335" y="425" width="220" height="110" fill="#fff" stroke="#74ad99"/><text x="1445" y="455" font-weight="700">复核决策器</text><text x="1445" y="480">Gate / 残余风险</text><text x="1445" y="505">接受 / 回退 / 下一轮</text><rect x="1585" y="425" width="110" height="110" fill="#fff1f0" stroke="#d92d20"/><text x="1640" y="470" font-weight="700" fill="#b42318">人工</text><text x="1640" y="498" font-weight="700" fill="#b42318">审批</text></g>
<rect x="50" y="620" width="1700" height="190" rx="10" fill="#fff8e8" stroke="#c49a36" stroke-width="2"/><text x="80" y="655" font-size="21" font-weight="700" fill="#765c14">III  业务处理与资源控制层</text><g font-size="15" text-anchor="middle"><rect x="90" y="685" width="210" height="90" fill="#fff" stroke="#d2ad51"/><text x="195" y="720" font-weight="700">读取边界</text><text x="195" y="747">分块 / 列裁剪 / row-group</text><rect x="330" y="685" width="210" height="90" fill="#fff" stroke="#d2ad51"/><text x="435" y="720" font-weight="700">Merge / Join</text><text x="435" y="747">候选关系 / 中间扩张</text><rect x="570" y="685" width="210" height="90" fill="#fff" stroke="#d2ad51"/><text x="675" y="720" font-weight="700">筛选与特征</text><text x="675" y="747">切片 / 中间对象</text><rect x="810" y="685" width="210" height="90" fill="#fff" stroke="#d2ad51"/><text x="915" y="720" font-weight="700">模型评分</text><text x="915" y="747">批预测 / 流式输出</text><rect x="1050" y="685" width="210" height="90" fill="#fff" stroke="#d2ad51"/><text x="1155" y="720" font-weight="700">评估与报表</text><text x="1155" y="747">阶段释放 / 聚合</text><rect x="1290" y="685" width="210" height="90" fill="#fff" stroke="#d2ad51"/><text x="1395" y="720" font-weight="700">资源防护</text><text x="1395" y="747">memory guard / 上限</text><rect x="1530" y="685" width="170" height="90" fill="#fff" stroke="#d2ad51"/><text x="1615" y="720" font-weight="700">输出</text><text x="1615" y="747">结果 / 日志</text></g>
<rect x="50" y="850" width="1700" height="100" rx="10" fill="#f7eef5" stroke="#a56e91" stroke-width="2"/><text x="80" y="885" font-size="21" font-weight="700" fill="#713c5d">IV  证据反馈层</text><text x="430" y="900" font-size="16">Findings / Fix / Validation / Measurement / Review / Gate</text><text x="1160" y="900" font-size="16">输出契约、资源曲线、残余风险 → 下一轮 RunPlan 或接受</text>
<g stroke="#526174" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M860 320v40"/><path d="M850 580v40"/><path d="M850 810v40"/><path d="M305 480h30M555 480h30M805 480h30M1055 480h30M1305 480h30M1555 480h30"/><path d="M300 730h30M540 730h30M780 730h30M1020 730h30M1260 730h30M1500 730h30"/></g><path d="M1450 900 C 1150 1020, 500 1020, 300 950" fill="none" stroke="#7f56d9" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#a)"/><text x="875" y="1015" text-anchor="middle" font-size="16" fill="#6941c6">虚线反馈流：Gate 失败、收益不足或残余风险超阈值时回到计划编译器</text><text x="70" y="1060" font-size="14" fill="#667085">实线：主数据流与控制流；虚线：证据反馈流；模块按知识、治理、处理、证据四层组织</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#526174"/></marker></defs></svg>
