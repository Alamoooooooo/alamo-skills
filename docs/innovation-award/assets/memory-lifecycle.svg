<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="940" viewBox="0 0 1800 940">
<rect width="1800" height="940" fill="#fff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="900" y="42" text-anchor="middle" font-size="30" font-weight="700" fill="#172b4d">图 9 分阶段对象内存管理与峰值控制机制</text><text x="900" y="72" text-anchor="middle" font-size="16" fill="#667085">在数据加载、连接、特征构建和评分阶段分别限制对象规模，并在阶段结束后释放不再使用的对象</text>
<rect x="65" y="105" width="1670" height="105" rx="9" fill="#f8fafc" stroke="#98a2b3"/><text x="95" y="140" font-size="20" font-weight="700" fill="#344054">资源控制规则</text><g text-anchor="middle" font-size="16"><rect x="285" y="125" width="220" height="56" rx="6" fill="#eaf2fb" stroke="#527da8"/><text x="395" y="160" font-weight="700">内存预算检查</text><rect x="555" y="125" width="260" height="56" rx="6" fill="#fff8e8" stroke="#c49a36"/><text x="685" y="160" font-weight="700">候选规模与批量上限</text><rect x="865" y="125" width="245" height="56" rx="6" fill="#edf8f3" stroke="#4e947d"/><text x="987" y="160" font-weight="700">阶段内存监控</text><rect x="1160" y="125" width="245" height="56" rx="6" fill="#f7eef5" stroke="#a56e91"/><text x="1282" y="160" font-weight="700">超限降级或停止</text><rect x="1455" y="125" width="220" height="56" rx="6" fill="#eef0f4" stroke="#667085"/><text x="1565" y="160" font-weight="700">运行记录</text></g>
<text x="240" y="260" font-size="21" font-weight="700" fill="#344054">处理阶段与对象内存占用</text><rect x="240" y="275" width="1430" height="420" fill="#fbfcfe" stroke="#d0d5dd"/><g stroke="#d0d5dd" stroke-width="1"><path d="M430 275v420M660 275v420M890 275v420M1120 275v420M1350 275v420M1580 275v420"/><path d="M240 365h1430M240 455h1430M240 545h1430M240 635h1430"/></g><g font-size="16" fill="#344054"><text x="85" y="325">读取数据</text><text x="85" y="415">候选关系</text><text x="85" y="505">特征数据</text><text x="85" y="595">评分与结果</text><text x="85" y="675">保存与释放</text></g><g text-anchor="middle" font-size="14" fill="#667085"><text x="315" y="720">按列读取</text><text x="545" y="720">分批处理</text><text x="775" y="720">先筛选</text><text x="1005" y="720">分批连接</text><text x="1235" y="720">分批评分</text><text x="1465" y="720">保存结果</text><text x="1625" y="720">释放对象</text></g>
<rect x="270" y="275" width="315" height="45" rx="5" fill="#527da8"/><text x="427" y="304" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">列投影 + row-group 扫描</text><rect x="480" y="365" width="330" height="45" rx="5" fill="#c49a36"/><text x="645" y="394" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">候选关系分片：N_candidate ≤ N_cap</text><rect x="740" y="455" width="300" height="45" rx="5" fill="#a56e91"/><text x="890" y="484" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">特征块局部物化</text><rect x="1080" y="545" width="260" height="45" rx="5" fill="#4e947d"/><text x="1210" y="574" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">micro-batch 推理</text><rect x="1285" y="635" width="210" height="45" rx="5" fill="#667085"/><text x="1390" y="664" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">checkpoint / gc</text>
<g stroke="#d92d20" fill="none" stroke-width="3" marker-end="url(#r)"><path d="M585 300v38"/><path d="M810 390v38"/><path d="M1040 480v38"/><path d="M1340 570v38"/></g><text x="1555" y="272" font-size="15" fill="#b42318">批次边界</text><path d="M1530 280h100" stroke="#d92d20" stroke-width="3" marker-end="url(#r)"/>
<rect x="155" y="770" width="1490" height="90" rx="9" fill="#edf8f3" stroke="#4e947d" stroke-width="2"/><text x="900" y="808" text-anchor="middle" font-size="20" font-weight="700" fill="#24634f">峰值控制的核心是：大对象按阶段分批处理，前一阶段完成后再进入下一阶段，避免多类对象同时堆积</text><text x="900" y="840" text-anchor="middle" font-size="16" fill="#475467">当内存接近预算时，系统缩小批量、限制 Join 扩张、保存阶段结果，或停止继续加载下一批数据</text></g><defs><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#d92d20"/></marker></defs></svg>
