<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
<rect width="1600" height="980" fill="#fff"/>
<text x="800" y="42" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#172b4d">图 1 Skill + Agent 整体架构与信息流向</text>
<text x="800" y="72" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#667085">知识复用、受控编排、业务处理与证据反馈的端到端闭环</text>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<rect x="70" y="110" width="1460" height="130" rx="10" fill="#eef4fb" stroke="#527da8" stroke-width="2"/>
<text x="105" y="145" font-size="21" font-weight="700" fill="#214b73">A  知识与规则供给层</text>
<rect x="105" y="165" width="265" height="52" rx="6" fill="#fff" stroke="#8da9c7"/><text x="237" y="197" text-anchor="middle" font-size="16">Memory Skill Core</text>
