<rect x="695" y="165" width="265" height="52" rx="6" fill="#fff" stroke="#8da9c7"/><text x="827" y="197" text-anchor="middle" font-size="16">项目 Overlay</text>
<rect x="990" y="165" width="265" height="52" rx="6" fill="#fff" stroke="#8da9c7"/><text x="1122" y="197" text-anchor="middle" font-size="16">验证 Recipe / Gate</text>
<rect x="1285" y="165" width="205" height="52" rx="6" fill="#fff" stroke="#8da9c7"/><text x="1387" y="197" text-anchor="middle" font-size="16">宿主适配</text>
