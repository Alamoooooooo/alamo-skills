<text x="105" y="320" font-size="21" font-weight="700" fill="#24634f">B  Agent 受治理编排层</text>
<rect x="105" y="345" width="220" height="75" rx="6" fill="#fff" stroke="#74ad99"/><text x="215" y="375" text-anchor="middle" font-size="16" font-weight="700">① 意图解析</text><text x="215" y="400" text-anchor="middle" font-size="14">RunIntent</text>
<rect x="365" y="345" width="220" height="75" rx="6" fill="#fff" stroke="#74ad99"/><text x="475" y="375" text-anchor="middle" font-size="16" font-weight="700">② 计划生成</text><text x="475" y="400" text-anchor="middle" font-size="14">RunPlan</text>
<rect x="625" y="345" width="220" height="75" rx="6" fill="#fff" stroke="#74ad99"/><text x="735" y="375" text-anchor="middle" font-size="16" font-weight="700">③ 策略校验</text><text x="735" y="400" text-anchor="middle" font-size="14">范围 / 权限 / 预算</text>
<rect x="885" y="345" width="220" height="75" rx="6" fill="#fff" stroke="#74ad99"/><text x="995" y="375" text-anchor="middle" font-size="16" font-weight="700">④ Skill 编排</text><text x="995" y="400" text-anchor="middle" font-size="14">check → fix → review</text>
<rect x="1145" y="345" width="345" height="75" rx="6" fill="#fff" stroke="#74ad99"/><text x="1317" y="375" text-anchor="middle" font-size="16" font-weight="700">⑤ 人工审批与安全停止</text><text x="1317" y="400" text-anchor="middle" font-size="14">候选变更 / 失败回退 / 终止</text>
<rect x="70" y="495" width="1460" height="175" rx="10" fill="#fff8e8" stroke="#c49a36" stroke-width="2"/>
<text x="105" y="530" font-size="21" font-weight="700" fill="#765c14">C  业务处理与资源控制层</text>
<rect x="105" y="555" width="190" height="75" rx="6" fill="#fff" stroke="#d2ad51"/><text x="200" y="585" text-anchor="middle" font-size="16" font-weight="700">数据读取</text><text x="200" y="610" text-anchor="middle" font-size="14">分块 / row-group</text>
<rect x="335" y="555" width="190" height="75" rx="6" fill="#fff" stroke="#d2ad51"/><text x="430" y="585" text-anchor="middle" font-size="16" font-weight="700">Merge / Join</text><text x="430" y="610" text-anchor="middle" font-size="14">候选关系计算</text>
<rect x="565" y="555" width="190" height="75" rx="6" fill="#fff" stroke="#d2ad51"/><text x="660" y="585" text-anchor="middle" font-size="16" font-weight="700">筛选与特征</text><text x="660" y="610" text-anchor="middle" font-size="14">列裁剪 / 分阶段</text>
