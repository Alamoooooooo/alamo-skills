<rect x="1025" y="555" width="190" height="75" rx="6" fill="#fff" stroke="#d2ad51"/><text x="1120" y="585" text-anchor="middle" font-size="16" font-weight="700">评估与报表</text><text x="1120" y="610" text-anchor="middle" font-size="14">中间结果释放</text>
<rect x="1255" y="555" width="235" height="75" rx="6" fill="#fff" stroke="#d2ad51"/><text x="1372" y="585" text-anchor="middle" font-size="16" font-weight="700">memory guard</text><text x="1372" y="610" text-anchor="middle" font-size="14">候选规模 / 内存上限</text>
<rect x="70" y="715" width="1460" height="135" rx="10" fill="#f7eef5" stroke="#a56e91" stroke-width="2"/>
<text x="105" y="750" font-size="21" font-weight="700" fill="#713c5d">D  证据、反馈与决策层</text>
<rect x="105" y="770" width="220" height="52" rx="6" fill="#fff" stroke="#bd8baa"/><text x="215" y="802" text-anchor="middle" font-size="16">Findings / Fix</text>
<rect x="365" y="770" width="220" height="52" rx="6" fill="#fff" stroke="#bd8baa"/><text x="475" y="802" text-anchor="middle" font-size="16">Validation / Measure</text>
<rect x="625" y="770" width="220" height="52" rx="6" fill="#fff" stroke="#bd8baa"/><text x="735" y="802" text-anchor="middle" font-size="16">Output Contract</text>
<rect x="885" y="770" width="220" height="52" rx="6" fill="#fff" stroke="#bd8baa"/><text x="995" y="802" text-anchor="middle" font-size="16">Review / Residual Risk</text>
<rect x="1145" y="770" width="345" height="52" rx="6" fill="#fff" stroke="#bd8baa"/><text x="1317" y="802" text-anchor="middle" font-size="16">Gate 结果 → 下一轮 RunPlan / 接受</text>
<g stroke="#526174" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M800 240v45"/><path d="M800 450v45"/><path d="M800 670v45"/><path d="M325 382h40M585 382h40M845 382h40M1105 382h40"/><path d="M295 592h40M525 592h40M755 592h40M985 592h40M1215 592h40"/><path d="M1317 715v-40M1105 796h40"/></g>
<path d="M1095 796 C 900 900, 500 900, 300 850 L300 715" fill="none" stroke="#7f56d9" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#a)"/><text x="740" y="915" text-anchor="middle" font-size="16" fill="#6941c6">证据反馈：Gate 失败或收益不足时，回到 RunPlan 重新编排</text>
<text x="80" y="955" font-size="14" fill="#667085">实线箭头：主执行流；虚线箭头：证据反馈与迭代流；A—D：论文图层级划分</text>
</g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#526174"/></marker></defs></svg>
