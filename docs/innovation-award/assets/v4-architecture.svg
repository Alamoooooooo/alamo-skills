<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#fff"/><text x="640" y="42" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="700" fill="#1f2937">图 1  Skill—Agent—业务处理—证据验证总体架构</text>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" text-anchor="middle"><rect x="80" y="110" width="1120" height="110" fill="#eaf2fb" stroke="#527da8" stroke-width="2"/><text x="640" y="155" font-weight="700" fill="#214b73">Skill 知识层</text><text x="640" y="190" font-size="17" fill="#40566f">热点模式库 · 修复策略 · 验证协议 · 项目 Overlay</text><rect x="80" y="265" width="1120" height="110" fill="#eef7f3" stroke="#4e947d" stroke-width="2"/><text x="640" y="310" font-weight="700" fill="#24634f">Agent 执行治理层</text><text x="640" y="345" font-size="17" fill="#46675c">RunIntent → RunPlan → 候选修复 → 人工审批 → 有界执行</text><rect x="80" y="420" width="540" height="110" fill="#fff7e5" stroke="#c49a36" stroke-width="2"/><text x="350" y="465" font-weight="700" fill="#765c14">业务处理层</text><text x="350" y="500" font-size="17" fill="#6e5a2d">读取 · Merge · 筛选 · 特征构建 · 评分 · 评估</text><rect x="660" y="420" width="540" height="110" fill="#f6eef4" stroke="#a56e91" stroke-width="2"/><text x="930" y="465" font-weight="700" fill="#713c5d">证据验证层</text><text x="930" y="500" font-size="17" fill="#6f5265">输出契约 · 测量口径 · Gate · Review</text><path d="M640 220v45M640 375v45M350 530v70h580v-70" fill="none" stroke="#526174" stroke-width="3" marker-end="url(#a)"/><text x="640" y="650" text-anchor="middle" font-size="18" fill="#465467">在资源约束下形成可追溯、可复用、可迁移的优化闭环</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#526174"/></marker></defs></svg>
