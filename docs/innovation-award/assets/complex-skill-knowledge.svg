<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fff"/><text x="800" y="42" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#172b4d">图 3 Memory Skill 内部知识架构与跨项目迁移关系</text><text x="800" y="72" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#667085">通用协议、技术栈模式、Skill Core、项目 Overlay 和宿主后端的组合方式</text><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="70" y="110" width="920" height="650" rx="10" fill="#f8fafc" stroke="#98a2b3" stroke-width="2"/><text x="105" y="145" font-size="21" font-weight="700" fill="#344054">A  Skill Package 内部层次</text><g text-anchor="middle" font-size="16"><rect x="110" y="175" width="840" height="90" rx="7" fill="#eaf2fb" stroke="#527da8"/><text x="530" y="212" font-weight="700" fill="#214b73">宿主适配层</text><text x="530" y="240">Codex backend · Prompt Bundle backend · degraded mode · dependency diagnostics</text><rect x="110" y="285" width="840" height="90" rx="7" fill="#edf8f3" stroke="#4e947d"/><text x="530" y="322" font-weight="700" fill="#24634f">项目 Overlay 层</text><text x="530" y="350">热点路径 · 业务契约 · smoke 命令 · 测量口径 · review targets</text><rect x="110" y="395" width="840" height="90" rx="7" fill="#fff8e8" stroke="#c49a36"/><text x="530" y="432" font-weight="700" fill="#765c14">Skill Core 层</text><text x="530" y="460">memory-check · memory-fix · validation · memory-review</text><rect x="110" y="505" width="840" height="90" rx="7" fill="#f7eef5" stroke="#a56e91"/><text x="530" y="542" font-weight="700" fill="#713c5d">技术栈模式库层</text><text x="530" y="570">读取物化 · 连接扩张 · 复制放大 · 假分块 · 模型驻留 · 峰值转移 · 并发重复</text><rect x="110" y="615" width="840" height="90" rx="7" fill="#eef0f4" stroke="#98a2b3"/><text x="530" y="652" font-weight="700" fill="#344054">协议与证据层</text><text x="530" y="680">Findings · Fix · Validation · Measurement · Review · Gate · Output Contract</text></g><g stroke="#526174" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M530 265v20M530 375v20M530 485v20M530 595v20"/></g><rect x="1035" y="110" width="495" height="650" rx="10" fill="#fff" stroke="#d0d5dd" stroke-width="2"/><text x="1065" y="145" font-size="21" font-weight="700" fill="#344054">B  跨项目迁移与输出</text><g text-anchor="middle" font-size="17"><rect x="1080" y="185" width="405" height="75" rx="7" fill="#eef4fb" stroke="#8da9c7"/><text x="1282" y="218" font-weight="700">通用 Skill Package</text><text x="1282" y="243">规则、协议和模式库</text><path d="M1282 260v48" stroke="#526174" stroke-width="3" marker-end="url(#a)"/><rect x="1080" y="310" width="405" height="75" rx="7" fill="#edf8f3" stroke="#74ad99"/><text x="1282" y="343" font-weight="700">叠加项目 Overlay</text><text x="1282" y="368">目标仓库和业务契约</text><path d="M1282 385v48" stroke="#526174" stroke-width="3" marker-end="url(#a)"/><rect x="1080" y="435" width="405" height="75" rx="7" fill="#fff8e8" stroke="#d2ad51"/><text x="1282" y="468" font-weight="700">宿主执行</text><text x="1282" y="493">Codex / Prompt Bundle</text><path d="M1282 510v48" stroke="#526174" stroke-width="3" marker-end="url(#a)"/><rect x="1080" y="560" width="405" height="75" rx="7" fill="#f7eef5" stroke="#bd8baa"/><text x="1282" y="593" font-weight="700">结构化报告</text><text x="1282" y="618">可审计证据与复用资产</text><path d="M950 730h125" stroke="#7f56d9" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#a)"/><text x="1010" y="712" text-anchor="middle" font-size="14" fill="#6941c6">项目迁移边界</text></g><text x="800" y="825" text-anchor="middle" font-size="17" fill="#475467">科学图表语义：层级表示抽象边界，箭头表示依赖与信息流，边框表示可独立替换的模块</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#526174"/></marker></defs></svg>
