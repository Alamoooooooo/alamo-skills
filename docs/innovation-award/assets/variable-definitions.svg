    <text x="85" y="115" font-size="20" font-weight="700" fill="#214b73">A  峰值内存分解变量</text><line x1="90" y1="135" x2="570" y2="135" stroke="#b7c8dc"/>
    <g font-family="Georgia,serif" font-size="22" font-style="italic"><text x="105" y="180">M<tspan baseline-shift="sub" font-size="15">base</tspan></text><text x="105" y="225">M<tspan baseline-shift="sub" font-size="15">input</tspan></text><text x="105" y="270">M<tspan baseline-shift="sub" font-size="15">intermediate</tspan></text><text x="105" y="315">M<tspan baseline-shift="sub" font-size="15">model</tspan></text><text x="105" y="360">M<tspan baseline-shift="sub" font-size="15">concurrency</tspan></text></g>
    <g font-size="17"><text x="315" y="180">运行时与基础库驻留</text><text x="315" y="225">输入批次与加载缓冲</text><text x="315" y="270">宽表、候选矩阵、临时副本与评估结果</text><text x="315" y="315">模型、特征转换与推理缓存</text><text x="315" y="360">工作进程或并发任务的重复占用</text></g>
