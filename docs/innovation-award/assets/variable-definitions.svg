    <g font-family="Georgia,serif" font-size="22" font-style="italic"><text x="705" y="190">M<tspan baseline-shift="sub" font-size="15">batch</tspan></text><text x="705" y="245">N<tspan baseline-shift="sub" font-size="15">candidate</tspan></text><text x="705" y="300">m̄<tspan baseline-shift="sub" font-size="15">row</tspan></text><text x="705" y="355">M<tspan baseline-shift="sub" font-size="15">budget</tspan> / M<tspan baseline-shift="sub" font-size="15">reserve</tspan></text></g>
