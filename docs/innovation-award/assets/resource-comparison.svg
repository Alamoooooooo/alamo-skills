<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <rect width="1000" height="600" fill="#f7f9fc"/>
  <text x="500" y="42" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="700" fill="#14213d">优化前后内存资源对比</text>
  <line x1="150" y1="490" x2="900" y2="490" stroke="#526174" stroke-width="3"/><line x1="150" y1="90" x2="150" y2="490" stroke="#526174" stroke-width="3"/>
  <g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#526174"><text x="135" y="495" text-anchor="end">0</text><text x="135" y="415" text-anchor="end">10 GB</text><text x="135" y="335" text-anchor="end">20 GB</text><text x="135" y="255" text-anchor="end">30 GB</text><text x="135" y="175" text-anchor="end">40 GB</text><text x="135" y="95" text-anchor="end">50 GB 上限</text></g>
  <g stroke="#d5dce5" stroke-width="1"><line x1="150" y1="410" x2="900" y2="410"/><line x1="150" y1="330" x2="900" y2="330"/><line x1="150" y1="250" x2="900" y2="250"/><line x1="150" y1="170" x2="900" y2="170"/><line x1="150" y1="90" x2="900" y2="90"/></g>
  <rect x="270" y="78" width="170" height="412" fill="#d95d5d"/><rect x="610" y="250" width="170" height="240" fill="#3caea3"/>
  <line x1="150" y1="90" x2="900" y2="90" stroke="#9c2c2c" stroke-width="4" stroke-dasharray="10 8"/>
  <g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="middle"><text x="355" y="535" font-size="20" font-weight="700" fill="#9c2c2c">优化前</text><text x="695" y="535" font-size="20" font-weight="700" fill="#176d60">优化后</text><text x="355" y="65" font-size="18" font-weight="700" fill="#9c2c2c">超过 50 GB</text><text x="695" y="235" font-size="18" font-weight="700" fill="#176d60">20 至 30 GB 区间</text></g>
  <text x="500" y="575" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#526174">优化前表示资源需求超过 50 GB 可用上限，优化后表示运行期间主要占用区间。</text>
</svg>
