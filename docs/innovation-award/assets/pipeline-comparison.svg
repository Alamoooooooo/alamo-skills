<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690">
  <rect width="1200" height="690" fill="#f7f9fc"/>
  <text x="600" y="40" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="700" fill="#14213d">优化前后数据处理路径对比</text>
  <g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">
    <rect x="65" y="75" width="500" height="545" rx="12" fill="#fff0f0" stroke="#d95d5d" stroke-width="3"/>
    <text x="315" y="116" text-anchor="middle" font-size="23" font-weight="700" fill="#9c2c2c">优化前：峰值膨胀</text>
    <g font-size="17" fill="#4a2020">
      <rect x="125" y="145" width="380" height="55" rx="8" fill="#f7c6c6"/><text x="315" y="180" text-anchor="middle">全量读取</text>
      <path d="M315 200 L315 225" stroke="#b44949" stroke-width="3" marker-end="url(#a)"/>
      <rect x="125" y="225" width="380" height="55" rx="8" fill="#f7c6c6"/><text x="315" y="260" text-anchor="middle">全量物化到内存</text>
      <path d="M315 280 L315 305" stroke="#b44949" stroke-width="3" marker-end="url(#a)"/>
      <rect x="125" y="305" width="380" height="55" rx="8" fill="#f7c6c6"/><text x="315" y="340" text-anchor="middle">宽表 / 候选矩阵</text>
      <path d="M315 360 L315 385" stroke="#b44949" stroke-width="3" marker-end="url(#a)"/>
      <rect x="125" y="385" width="380" height="55" rx="8" fill="#f7c6c6"/><text x="315" y="420" text-anchor="middle">全量加载后再切块</text>
      <path d="M315 440 L315 465" stroke="#b44949" stroke-width="3" marker-end="url(#a)"/>
      <rect x="125" y="465" width="380" height="55" rx="8" fill="#f7c6c6"/><text x="315" y="500" text-anchor="middle">多份中间对象同时驻留</text>
      <text x="315" y="570" text-anchor="middle" font-size="20" font-weight="700" fill="#9c2c2c">峰值超过 50 GB · 存在 OOM 风险</text>
    </g>
    <rect x="635" y="75" width="500" height="545" rx="12" fill="#eaf8f5" stroke="#299b88" stroke-width="3"/>
    <text x="885" y="116" text-anchor="middle" font-size="23" font-weight="700" fill="#176d60">优化后：有界处理</text>
    <g font-size="17" fill="#164f48">
      <rect x="695" y="145" width="380" height="55" rx="8" fill="#bde8de"/><text x="885" y="180" text-anchor="middle">按客户分块 / row-group 读取</text>
      <path d="M885 200 L885 225" stroke="#258c7b" stroke-width="3" marker-end="url(#b)"/>
      <rect x="695" y="225" width="380" height="55" rx="8" fill="#bde8de"/><text x="885" y="260" text-anchor="middle">读取边界提前裁剪列</text>
      <path d="M885 280 L885 305" stroke="#258c7b" stroke-width="3" marker-end="url(#b)"/>
      <rect x="695" y="305" width="380" height="55" rx="8" fill="#bde8de"/><text x="885" y="340" text-anchor="middle">流式评分 / 分批预测</text>
      <path d="M885 360 L885 385" stroke="#258c7b" stroke-width="3" marker-end="url(#b)"/>
      <rect x="695" y="385" width="380" height="55" rx="8" fill="#bde8de"/><text x="885" y="420" text-anchor="middle">阶段性落盘并及时释放对象</text>
      <path d="M885 440 L885 465" stroke="#258c7b" stroke-width="3" marker-end="url(#b)"/>
      <rect x="695" y="465" width="380" height="55" rx="8" fill="#bde8de"/><text x="885" y="500" text-anchor="middle">memory guard / 安全停止</text>
      <text x="885" y="570" text-anchor="middle" font-size="20" font-weight="700" fill="#176d60">20 至 30 GB 运行区间</text>
    </g>
  </g>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#b44949"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#258c7b"/></marker></defs>
</svg>
