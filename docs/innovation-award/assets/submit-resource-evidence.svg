<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700">
  <rect width="1280" height="700" fill="#ffffff"/>
  <text x="640" y="42" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="700" fill="#1f2937">图 11 资源约束下的峰值需求区间对比</text>
  <text x="640" y="72" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" fill="#667085">同一 50 GB 可用内存上限；区间为脱敏工程口径，不代表单次精确测量值</text>
  <g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">
    <rect x="110" y="100" width="1060" height="470" fill="#ffffff" stroke="#d0d5dd" stroke-width="2"/>
    <line x1="190" y1="130" x2="190" y2="530" stroke="#475467" stroke-width="3"/>
    <line x1="190" y1="530" x2="1120" y2="530" stroke="#475467" stroke-width="3"/>
    <g stroke="#e4e7ec" stroke-width="1">
      <line x1="190" y1="473" x2="1120" y2="473"/><line x1="190" y1="416" x2="1120" y2="416"/>
      <line x1="190" y1="359" x2="1120" y2="359"/><line x1="190" y1="302" x2="1120" y2="302"/>
      <line x1="190" y1="245" x2="1120" y2="245"/><line x1="190" y1="188" x2="1120" y2="188"/>
      <line x1="190" y1="131" x2="1120" y2="131"/>
    </g>
    <g fill="#475467" font-size="15" text-anchor="end">
      <text x="178" y="535">0</text><text x="178" y="478">10 GB</text><text x="178" y="421">20 GB</text>
      <text x="178" y="364">30 GB</text><text x="178" y="307">40 GB</text><text x="178" y="250">50 GB</text>
      <text x="178" y="193">60 GB</text><text x="178" y="136">70 GB</text>
    </g>
    <line x1="190" y1="245" x2="1120" y2="245" stroke="#b42318" stroke-width="2.5" stroke-dasharray="10 8"/>
    <text x="1110" y="234" text-anchor="end" font-size="16" font-weight="700" fill="#b42318">机器可用内存上限 50 GB</text>
    <rect x="315" y="131" width="250" height="57" fill="#d96c63" stroke="#912018" stroke-width="2"/>
    <rect x="315" y="188" width="250" height="342" fill="#f6d2ce" stroke="#b42318" stroke-width="2"/>
    <rect x="715" y="359" width="250" height="57" fill="#55b49b" stroke="#0f6957" stroke-width="2"/>
    <rect x="715" y="416" width="250" height="114" fill="#d4eee7" stroke="#16806b" stroke-width="2"/>
    <text x="440" y="120" text-anchor="middle" font-size="19" font-weight="700" fill="#912018">60 至 70 GB 脱敏峰值需求区间</text>
    <text x="840" y="348" text-anchor="middle" font-size="19" font-weight="700" fill="#0f6957">20 至 30 GB 主要运行区间</text>
    <text x="440" y="558" text-anchor="middle" font-size="20" font-weight="700" fill="#344054">优化前：超出资源上限</text>
    <text x="840" y="558" text-anchor="middle" font-size="20" font-weight="700" fill="#344054">优化后：进入可运行区间</text>
    <rect x="250" y="605" width="780" height="58" rx="6" fill="#f8fafc" stroke="#d0d5dd"/>
    <text x="640" y="630" text-anchor="middle" font-size="16" fill="#475467">优化前需求来源：Merge / Join、切片、宽表及多个中间对象叠加驻留</text>
    <text x="640" y="653" text-anchor="middle" font-size="16" fill="#475467">优化后控制手段：读取边界分块、列裁剪、流式评分、阶段性落盘与资源保护</text>
  </g>
</svg>
