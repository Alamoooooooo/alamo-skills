<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="700" fill="#14213d">图 5 工程资源模型汇总</text>
  <g font-family="Georgia,serif" fill="#14213d">
    <rect x="70" y="75" width="1060" height="175" rx="12" fill="#eef4fb" stroke="#b7c8dc"/>
    <text x="100" y="112" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="700">（1）峰值内存分解</text>
    <text x="600" y="185" text-anchor="middle" font-size="34" font-style="italic">M<tspan baseline-shift="sub" font-size="22">peak</tspan> = M<tspan baseline-shift="sub" font-size="22">base</tspan> + M<tspan baseline-shift="sub" font-size="22">input</tspan> + M<tspan baseline-shift="sub" font-size="22">intermediate</tspan> + M<tspan baseline-shift="sub" font-size="22">model</tspan> + M<tspan baseline-shift="sub" font-size="22">concurrency</tspan></text>
    <text x="600" y="222" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#526174">运行时、输入数据、中间对象、模型状态和并发工作进程</text>
    <rect x="70" y="285" width="1060" height="175" rx="12" fill="#fdf7e5" stroke="#e5cf83"/>
    <text x="100" y="322" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="700">（2）资源预算约束</text>
    <text x="600" y="395" text-anchor="middle" font-size="34" font-style="italic">M<tspan baseline-shift="sub" font-size="22">base</tspan> + M<tspan baseline-shift="sub" font-size="22">batch</tspan> + N<tspan baseline-shift="sub" font-size="22">candidate</tspan> · m̄<tspan baseline-shift="sub" font-size="22">row</tspan> ≤ M<tspan baseline-shift="sub" font-size="22">budget</tspan> − M<tspan baseline-shift="sub" font-size="22">reserve</tspan></text>
    <text x="600" y="432" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#526174">批次和候选规模增长必须保持在批准的机器资源预算内</text>
    <rect x="70" y="495" width="1060" height="190" rx="12" fill="#eaf8f5" stroke="#a5d9ce"/>
    <text x="100" y="532" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="700">（3）利用率与恢复的运行余量</text>
    <text x="380" y="600" text-anchor="middle" font-size="32" font-style="italic">U<tspan baseline-shift="sub" font-size="21">memory</tspan> = M<tspan baseline-shift="sub" font-size="21">used</tspan> / M<tspan baseline-shift="sub" font-size="21">limit</tspan></text>
    <text x="820" y="600" text-anchor="middle" font-size="32" font-style="italic">M<tspan baseline-shift="sub" font-size="21">reserve</tspan> = M<tspan baseline-shift="sub" font-size="21">limit</tspan> − M<tspan baseline-shift="sub" font-size="21">used</tspan></text>
    <text x="600" y="650" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#176d60">优化后：在 50 GB 上限下，M_used 约为 20 至 30 GB</text>
  </g>
</svg>
